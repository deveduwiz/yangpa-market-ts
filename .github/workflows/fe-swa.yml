# fe(Vite React) → Azure Static Web Apps
#
# Secret: AZURE_STATIC_WEB_APPS_API_TOKEN
#   Azure 포털 > Static Web App > 개요 > 배포 토큰 관리
#
# SPA 새로고침 처리는 fe/public/staticwebapp.config.json 이 담당한다.
# (vite 가 public/ 아래를 dist/ 로 그대로 복사한다)

name: Deploy fe to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - 'fe/**'
      - '.github/workflows/fe-swa.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Build
        working-directory: fe
        run: |
          npm ci
          npm run build

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_JOLLY_SKY_065E76F00 }}
          action: upload
          app_location: fe/dist
          skip_app_build: true
