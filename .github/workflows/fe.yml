# fe(Vite React) → Azure Web App 배포
# VITE_* 는 빌드 시점에 인라인되므로, 값은 반드시 이 build job에서 주입된다.
# 기본값은 fe/.env.production 에 들어있고, 여기 env 로 덮어쓸 수 있다.

name: Build and deploy Vite app to Azure Web App - yangpa-fe

on:
  push:
    branches:
      - main
    paths:
      - 'fe/**'
      - '.github/workflows/fe.yml'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: fe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # 리포지토리 Variables 에 VITE_API_BASE_URL 을 넣어두면 .env.production 을 덮어쓴다.
      # (.env.production.local 이 .env.production 보다 우선순위가 높고, *.local 은 gitignore 대상)
      - name: Override API base URL (optional)
        if: vars.VITE_API_BASE_URL != ''
        run: echo "VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}" > .env.production.local

      - name: npm install and build
        run: |
          npm ci
          npm run build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: vite-dist
          path: fe/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: vite-dist

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'yangpa-fe'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_FE }}
