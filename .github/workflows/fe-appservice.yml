# fe(Vite React) → Azure App Service (Linux) 배포
#
# ⚠️ 기존 .github/workflows/fe.yml 도 fe/** push 에 반응합니다.
#    중복 배포를 막으려고 이 워크플로는 수동 실행 전용으로 두었습니다.
#    이쪽으로 굳히기로 하면 아래 push 블록의 주석을 풀고 fe.yml 은 삭제하거나 비활성화하세요.
#
# 필요한 Secret:
#   AZUREAPPSERVICE_PUBLISHPROFILE_FE  — Azure 포털 > App Service > 게시 프로필 가져오기, 파일 내용 전체
# 선택 Variable:
#   VITE_API_BASE_URL                  — 비우면 fe/.env.production 값을 사용

name: Deploy fe to Azure App Service (Linux)

on:
  workflow_dispatch:

  # push:
  #   branches: [main]
  #   paths:
  #     - 'fe/**'
  #     - '.github/workflows/fe-appservice.yml'

env:
  APP_NAME: yangpa-fe
  NODE_VERSION: '20.x'

# 같은 브랜치에서 배포가 겹치지 않게 한다 (진행 중인 배포는 취소하지 않고 대기)
concurrency:
  group: fe-appservice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: fe/package-lock.json

      # VITE_* 는 빌드 시점에 번들에 인라인된다. App Service 애플리케이션 설정에 넣어도
      # 이미 빌드된 JS 에는 반영되지 않으므로 반드시 여기서 주입해야 한다.
      # .env.production.local 이 .env.production 보다 우선순위가 높다 (*.local 은 gitignore 대상).
      - name: Override API base URL (optional)
        if: vars.VITE_API_BASE_URL != ''
        working-directory: fe
        run: echo "VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}" > .env.production.local

      - name: Install and build
        working-directory: fe
        run: |
          npm ci
          npm run build

      # ------------------------------------------------------------------
      # App Service Linux 의 Node 20+ 이미지에는 pm2 가 더 이상 들어있지 않다.
      # npx serve 는 기동할 때마다 네트워크를 타므로, Node 내장 모듈만 쓰는
      # 작은 정적 서버를 함께 배포한다. (의존성 0개, SPA fallback 포함)
      #
      # 이 파일을 리포지토리에 두고 싶으면 fe/server.cjs 로 옮기고
      # 이 스텝 대신 `cp fe/server.cjs fe/dist/` 로 바꾸면 된다.
      # ------------------------------------------------------------------
      - name: Generate static file server
        run: |
          cat > fe/dist/server.cjs <<'SERVER_EOF'
          const http = require('http');
          const fs = require('fs');
          const path = require('path');

          const root = __dirname;
          const port = process.env.PORT || 8080;

          const TYPES = {
            '.html': 'text/html; charset=utf-8',
            '.js': 'text/javascript; charset=utf-8',
            '.mjs': 'text/javascript; charset=utf-8',
            '.css': 'text/css; charset=utf-8',
            '.json': 'application/json; charset=utf-8',
            '.map': 'application/json; charset=utf-8',
            '.svg': 'image/svg+xml',
            '.png': 'image/png',
            '.jpg': 'image/jpeg',
            '.jpeg': 'image/jpeg',
            '.gif': 'image/gif',
            '.webp': 'image/webp',
            '.ico': 'image/x-icon',
            '.woff': 'font/woff',
            '.woff2': 'font/woff2',
            '.ttf': 'font/ttf',
            '.txt': 'text/plain; charset=utf-8',
          };

          function sendIndex(res, status) {
            fs.readFile(path.join(root, 'index.html'), (err, html) => {
              if (err) {
                res.writeHead(404, { 'Content-Type': 'text/plain; charset=utf-8' });
                return res.end('Not Found');
              }
              res.writeHead(status, {
                'Content-Type': 'text/html; charset=utf-8',
                'Cache-Control': 'no-cache',
              });
              res.end(html);
            });
          }

          http
            .createServer((req, res) => {
              if (req.method !== 'GET' && req.method !== 'HEAD') {
                res.writeHead(405, { Allow: 'GET, HEAD' });
                return res.end();
              }

              let urlPath;
              try {
                urlPath = decodeURIComponent(new URL(req.url, 'http://localhost').pathname);
              } catch {
                res.writeHead(400);
                return res.end('Bad Request');
              }

              if (urlPath === '/healthz') {
                res.writeHead(200, { 'Content-Type': 'text/plain' });
                return res.end('ok');
              }

              // 경로 조작 차단
              const target = path.join(root, urlPath);
              if (target !== root && !target.startsWith(root + path.sep)) {
                res.writeHead(400);
                return res.end('Bad Request');
              }

              fs.stat(target, (err, stat) => {
                const file = !err && stat.isDirectory() ? path.join(target, 'index.html') : target;

                fs.readFile(file, (readErr, buf) => {
                  // 없는 경로는 index.html 로 넘겨 React Router 가 처리하게 한다
                  if (readErr) return sendIndex(res, 200);

                  const ext = path.extname(file).toLowerCase();
                  // vite 가 /assets 아래에 해시 파일명을 쓰므로 영구 캐시가 안전하다
                  const hashed = urlPath.startsWith('/assets/');
                  res.writeHead(200, {
                    'Content-Type': TYPES[ext] || 'application/octet-stream',
                    'Cache-Control': hashed
                      ? 'public, max-age=31536000, immutable'
                      : 'no-cache',
                  });
                  res.end(req.method === 'HEAD' ? undefined : buf);
                });
              });
            })
            .listen(port, () => {
              console.log('[fe] serving ' + root + ' on :' + port);
            });
          SERVER_EOF
          node --check fe/dist/server.cjs
          echo "정적 서버 생성 완료"

      - uses: actions/upload-artifact@v4
        with:
          name: fe-dist
          path: fe/dist
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fe-dist
          path: dist

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: Production
          package: dist
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_FE }}
          # Linux 전용. 포털 > 구성 > 일반 설정 > 시작 명령 에 직접 넣어도 된다.
          startup-command: 'node server.cjs'
